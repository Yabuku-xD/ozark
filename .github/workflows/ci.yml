name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check backend/ ozark.py
      - name: Pytest
        run: pytest backend/tests/ -v --tb=short

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test
      - name: Build
        run: npm run build

  eval-gate:
    name: Release-gate smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm install
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - name: Start Ozark
        run: |
          python -m backend.server > ozark.log 2>&1 &
          echo $! > ozark.pid
          # Poll the health endpoint instead of a blind sleep.
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health >/dev/null; then
              echo "Ozark is up"
              break
            fi
            sleep 0.5
          done
      - name: Run release gate
        run: |
          python ozark.py run --agent sample-support-agent --count 25 \
            --gates '{"min_score":80,"max_critical_violations":0,"max_failed_scenarios":0}'
      - name: Async run smoke test
        run: |
          python ozark.py run --agent sample-support-agent --count 10 --async
      - name: Stop Ozark
        if: always()
        run: kill $(cat ozark.pid) || true
      - name: Dump server log on failure
        if: failure()
        run: cat ozark.log || true
