name: Ozark Evals

on:
  pull_request:
  workflow_dispatch:

jobs:
  ozark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile $(find backend -name '*.py' -not -path '*/__pycache__/*') ozark.py
      - run: npm run build
      - name: Start Ozark
        run: |
          python -m backend.server > ozark.log 2>&1 &
          echo $! > ozark.pid
          sleep 2
      - name: Run release gate
        run: |
          python ozark.py run --agent sample-support-agent --count 25 \
            --gates '{"min_score":80,"max_critical_violations":0,"max_failed_scenarios":0}'
      - name: Stop Ozark
        if: always()
        run: kill $(cat ozark.pid) || true
